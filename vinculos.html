<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vínculos de Educación a Distancia</title>
<style>
:root{--v:#72076F;--m:#92278F;--p:#E85D9E;--y:#FFC107;--t:#17A2B8;--g:#2FB380;--d:#1A0A19}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:"Segoe UI",Calibri,Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#4B0A49 0%,#2A0F29 48%,#150815 100%)}
header{padding:26px 5vw 0;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end}
h1{margin:0;font-size:clamp(28px,4.2vw,58px);line-height:1;letter-spacing:-.02em;font-weight:900}
h1 em{font-family:Georgia,serif;font-weight:400;color:var(--y)}
.sub{margin:6px 0 0;opacity:.8;font-size:clamp(14px,1.3vw,17px);max-width:760px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.1);border-radius:40px;padding:5px}
.tabs button{border:0;background:transparent;color:#fff;font-weight:800;border-radius:30px;padding:9px 22px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--y);color:#3A2A00}
.stage{position:relative;max-width:1180px;margin:0 auto;height:min(78vh,720px);min-height:560px}
.orbit{position:absolute;border:2px dashed rgba(255,255,255,.18);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.node{position:absolute;transform:translate(-50%,-50%);border:0;cursor:pointer;color:#fff;background:var(--c);border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.1;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 28%,transparent),0 12px 28px rgba(0,0,0,.4);transition:transform .25s,box-shadow .25s;padding:6px}
.node:hover,.node.on{transform:translate(-50%,-50%) scale(1.14);box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 40%,transparent),0 16px 36px rgba(0,0,0,.5);z-index:6}
.node.ctr{background:linear-gradient(135deg,var(--y),var(--p));color:#2A0F29;font-size:26px;box-shadow:0 0 60px rgba(255,193,7,.45)}
.node.f-media{opacity:.92}.node.f-baja{opacity:.7;border:3px dashed rgba(255,255,255,.7)}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tip{position:absolute;z-index:10;width:310px;background:#fff;color:#2B2530;border-radius:22px;padding:16px 18px;box-shadow:0 24px 50px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .15s;border-top:10px solid var(--c,#92278F)}
#tip.show{opacity:1}
#tip h4{margin:0 0 2px;font-size:17px;color:var(--v)}
#tip small{display:block;color:#6E6672;margin-bottom:6px}
#tip ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.4}
#tip .ev{margin-top:8px;font-size:12px;color:#6E6672;border-top:1px dashed #E4D3E3;padding-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:13px;opacity:.9;margin:0 0 24px;padding:0 5vw}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.legend i.d{border:2px dashed #fff;background:transparent}
.panel{max-width:1180px;margin:0 auto 40px;padding:0 5vw}
.box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:22px 28px}
.box h3{margin:0 0 10px;font-size:22px;color:var(--y)}
.row{display:grid;grid-template-columns:200px 1fr 90px;gap:12px;align-items:center;margin:8px 0;font-size:14px}
.tr{height:16px;background:rgba(255,255,255,.14);border-radius:8px;overflow:hidden;display:flex}
.tr i{display:block;height:100%}
.hidden{display:none}
.msg{font-size:15px;line-height:1.5;opacity:.95;max-width:900px}
@media(max-width:800px){.stage{height:640px}.row{grid-template-columns:120px 1fr 60px}}
</style>
</head>
<body>
<header>
  <div><h1>Con quiénes <em>trabaja EaD</em></h1><p class="sub" id="sub"></p></div>
  <div class="tabs" id="tabs"><button class="on" data-v="areas">Con otras áreas</button><button data-v="equipo">Dentro del equipo</button></div>
</header>
<div id="v-areas">
  <div class="stage" id="stage"><div id="tip"></div></div>
  <div class="legend"><span><i style="background:#92278F"></i>Interno</span><span><i style="background:#17A2B8"></i>Externo</span><span>Línea llena: vínculo con registros</span><span>Línea punteada: figura en planes o actas</span><span><i class="d"></i>Borde punteado: reunión prevista, sin registro</span></div>
</div>
<div id="v-equipo" class="hidden">
